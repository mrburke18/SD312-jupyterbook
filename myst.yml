version: 1
project:
  title: 'SD312: Machine Learning'
  copyright: '2026'
  github: mrburke18/SD312-jupyterbook
  bibliography:
    - references.bib
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/book.pdf
  toc:
    - file: index.md
    - file: fullCal.md
      hidden: true
    - title: Course Information
      children:
        - file: calendar.md
        - file: policy/index.md
    - title: Lecture Notes
      children:
        - file: notes/01Unsupervised/index.md
        - file: notes/02foodCluster.ipynb
    - title: Assignments
      children:
        - file: assignments/01Unsupervised/unsupervised.ipynb
    - title: Resources
      children:
        - file: resources/resources.md
execute:
  execute_notebooks: cache
  cache: ".jupyter_cache"
site:
  options:
    base_url: /SD312
    logo: logo.png
    favicon: logo.svg
    folders: true
  template: book-theme
